# ══════════════════════════════════════════════════════════════════════
#  story.toml: everything on the page except your letter.
#  Your letter lives in  content/letter.md
#
#  • {recipient}, {sender} and {nickname} are filled in automatically.
#  • In messages: blank line = new paragraph, **bold**, *italic*.
#  • Save the file while the live preview is running and the page reloads.
# ══════════════════════════════════════════════════════════════════════

[site]
recipient = "Adrian"
sender    = "Your Brother"                # ← put your name here
nickname  = "the Bakugo of the family"
hero_jp   = "誕生日おめでとう"              # "Happy birthday" in Japanese
hero_top  = "Happy Birthday"
date_line = ""                            # e.g. "November 12, 2026". Leave empty to hide it.
page_title = "Happy Birthday, {recipient}"
link_preview = "A letter from {sender}. Sound on."
site_url  = ""                            # optional: "https://YOUR-USER.github.io/REPO/" (nicer link previews)

[gate]                                    # the first screen he sees
kicker = "A letter for"
from   = "from {sender}"
button = "Open it"
hint   = "Sound on. Take your time."

[finale]
top     = "Happy Birthday,"
line    = "Go beyond. Plus Ultra."
signoff = "{sender}"
button  = "Read it again"

[media]
video_transition = "dip"   # "dip" = each clip fades out, next fades in  |  "crossfade" = overlap
video_fade   = 0.9         # seconds for each fade
dim          = 0.40        # darkness over the videos so text stays readable (0.0 – 0.8)
max_width    = 1280        # clips are scaled down to this width
crf          = 26          # video quality: lower = sharper + bigger files (20–30)
clip_audio   = true        # keep each clip's own sound, played quietly behind everything
clip_volume  = 0.12        # how loud that clip sound is, from 0.0 to 1.0 (0.12 is just audible)
music_volume = 0.70
voice_volume = 1.00
duck         = 0.25        # music drops to 25% while a voice line plays
auto_voice   = true        # play a card's voice line when it scrolls into view
normalize_audio = true     # even out loudness between songs and voice lines
music_bitrate = "160k"
voice_bitrate = "128k"


[trim]
# Cut the uploader's intros/outros (Patreon cards, "thanks for watching"…) off a clip.
# Key = the clip's file name without extension. Seconds are from the original video.
# Quote "at" times stay in the original video's seconds. The build shifts them for you.
"01-the-next-number-one" = { start = 5.3, end = 209.3 }
"01-brotherhood"         = { end = 96.6 }


