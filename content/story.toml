# ══════════════════════════════════════════════════════════════════════
#  SECTIONS: each one gets its own background clips, music and color.
#  The section id is also its media folder:  media/<id>/videos|music|voice
#
#  Flow block types:
#    hero      big "Happy Birthday" opener
#    letter    the next part of letter.md (split with [[next]])
#    message   a character talking to {recipient}      (character, text, voice?)
#    moment    a scene where they lifted someone up    (character, to, when, scene, lesson, line?, voice?)
#    spotlight a list card                             (title, intro?, points)
#
#  "line"  → paste the exact anime line you love; it shows as a big quote.
#  "voice" → file name (no extension needed) in media/<id>/voice/.
#            That clip plays when the card scrolls into view.
#
#  QUOTES: short lines that build up on the background as the clips play.
#    [[sections.quotes]]   character, text, video?, voice?
#    • Quote 1 shows when clip 1 starts, quote 2 with clip 2, and so on.
#    • video = "03-todo"  pins a quote to that clip instead (its file name,
#      or just the start of it like "03").
#    • at = 23.6  pops the quote up at that second of its clip (when it's said).
#    • No clips yet? The quotes still show up, one every few seconds.
#    • Keep them short: one or two lines reads best behind the letter.
# ══════════════════════════════════════════════════════════════════════

[[sections]]
